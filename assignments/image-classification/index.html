<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Assignment | CSCI 566</title>
  <link rel="icon" href="../../images/logo2.ico">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #202630; font: 17px/1.6 system-ui, sans-serif; }
    main { max-width: 560px; margin: 10vh auto; padding: 32px; background: white; border-radius: 12px; }
    a, h1 { color: #900; }
    h1 { font-size: 1.8rem; line-height: 1.25; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input, button { width: 100%; font: inherit; border-radius: 6px; padding: 10px 12px; }
    input { border: 1px solid #777; }
    button { margin-top: 16px; background: #900; color: white; border: 0; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #0069c2; outline-offset: 3px; }
    #status { min-height: 1.6em; margin-bottom: 0; }
    @media (max-width: 600px) { main { margin: 24px 16px; padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <a href="../../index.html">CSCI 566 course home</a>
    <h1>AI-Assisted Image Classification</h1>
    <p>Enter the password from the Piazza assignment announcement to view the assignment and download the starter files.</p>
    <form id="unlock-form">
      <label for="password">Assignment password</label>
      <input id="password" type="password" autocomplete="current-password" required spellcheck="false" aria-describedby="status">
      <button type="submit">Open assignment</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <noscript><p>Enable JavaScript in your browser to open the assignment.</p></noscript>
  </main>
  <script src="unlock.js"></script>
</body>
</html>
